[platformio]
src_dir = .

[env:c3mini]
platform = espressif32
board = lolin_c3_mini
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv      ; ohne OTA: ca. 3 MB fuer die App
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    links2004/WebSockets
    bblanchon/ArduinoJson@^7
    gin66/FastAccelStepper
